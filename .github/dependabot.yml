version: 2
updates:
  - package-ecosystem: pip
    directory: "/research"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "Etc/UTC"
    groups:
      research-python-stack:
        patterns:
          - "*"
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 1

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "Etc/UTC"
    groups:
      github-actions-runtime:
        patterns:
          - "*"
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 1
