name: Bitcoin blockspace fee-rate source feasibility preflight

on:
  push:
    branches: [main]
    paths:
      - "research/PREREGISTERED-QFR-2026-11-27-BTC-BLOCKSPACE-FEERATE-DOWNSIDE-01.md"
      - "research/btc_blockspace_fee_rate_source_preflight.py"
      - "research/test_btc_blockspace_fee_rate_source_preflight.py"
      - ".github/workflows/btc-blockspace-fee-rate-source-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qfr-btc-blockspace-fee-rate-source-preflight-main
  cancel-in-progress: false

jobs:
  source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout immutable triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Run deterministic source-schema and timing tests
        run: |
          set -euo pipefail
          python -m py_compile research/btc_blockspace_fee_rate_source_preflight.py research/test_btc_blockspace_fee_rate_source_preflight.py
          PYTHONPATH=research python -m unittest discover -s research -p "test_btc_blockspace_fee_rate_source_preflight.py" -v

      - name: Make exactly one read-only Mempool source request; do not run a backtest
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python research/btc_blockspace_fee_rate_source_preflight.py
          output="reports/generated/btc-blockspace-fee-rate-source-preflight/$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT/preflight.json"
          test -s "$output"
          echo "=== SOURCE PREFLIGHT RESULT ==="
          cat "$output"

      - name: Upload source-only manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: btc-blockspace-fee-rate-source-preflight-${{ github.run_id }}
          path: reports/generated/btc-blockspace-fee-rate-source-preflight/${{ github.run_id }}-attempt-${{ github.run_attempt }}/preflight.json
          if-no-files-found: warn
          retention-days: 30
