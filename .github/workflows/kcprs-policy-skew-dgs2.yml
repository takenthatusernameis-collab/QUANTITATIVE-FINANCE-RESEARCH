name: KC PRS option-implied policy-rate skew and 2Y Treasury yield forecast

on:
  push:
    branches: [main]
    paths:
      - "research/kcprs_policy_skew_dgs2.py"
      - "research/test_kcprs_policy_skew_dgs2.py"
      - "research/PREREGISTERED-QFR-2026-11-26-KCPRS-POLICY-SKEW-DGS2-01.md"
      - ".github/workflows/kcprs-policy-skew-dgs2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qfr-kcprs-policy-skew-dgs2-main
  cancel-in-progress: false

jobs:
  kcprs-backtest:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[QFR-ADMIT]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Assert immutable source checkout
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "Verified source commit: $actual"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Run deterministic timing, alignment, maturity and decision tests
        run: |
          set -euo pipefail
          python -m py_compile research/kcprs_policy_skew_dgs2.py research/test_kcprs_policy_skew_dgs2.py
          python -m unittest discover -s research -p "test_kcprs_policy_skew_dgs2.py" -v
          python -m unittest discover -s research -p "test_workflow_admission.py" -v

      - name: Retrieve official series and run preregistered walk-forward forecast
        run: |
          set -euo pipefail
          python research/kcprs_policy_skew_dgs2.py
          report="$(find reports/sessions -type f -name "*session-kcprs-policy-skew-$GITHUB_RUN_ID.md" | sort | tail -n 1)"
          manifest="reports/generated/kcprs-policy-skew-dgs2/$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT/manifest.json"
          test -n "$report"
          test -s "$report"
          test -s "$manifest"
          echo "=== RESEARCH REPORT ==="
          cat "$report"
          echo "=== GENERATED MANIFEST ==="
          cat "$manifest"

      - name: Persist reproducible research evidence to main
        if: success()
        run: |
          set -euo pipefail
          report="$(find reports/sessions -type f -name "*session-kcprs-policy-skew-$GITHUB_RUN_ID.md" | sort | tail -n 1)"
          manifest="reports/generated/kcprs-policy-skew-dgs2/$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT/manifest.json"
          test -n "$report"
          test -s "$report"
          test -s "$manifest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$report" "$manifest" research/HYPOTHESIS-REGISTRY.md research/PREREGISTERED-QFR-2026-11-26-KCPRS-POLICY-SKEW-DGS2-01.md
          if git diff --cached --quiet; then
            echo "No generated evidence changes to persist."
            exit 0
          fi
          git commit -m "Persist KC PRS policy-skew yield research evidence $GITHUB_RUN_ID"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
