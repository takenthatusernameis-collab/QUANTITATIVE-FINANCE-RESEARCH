name: Research workflow admission guard tests

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/workflows/**"
      - "research/test_workflow_admission.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission-guard-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Verify every research workflow has the atomic admission gate
        run: python -m unittest discover -s research -p "test_workflow_admission.py" -v

      - name: Run VXN/VIX handoff regression tests
        run: python -m unittest discover -s research -p "test_vxn_vix_cross_index_sp500_rv.py" -v
