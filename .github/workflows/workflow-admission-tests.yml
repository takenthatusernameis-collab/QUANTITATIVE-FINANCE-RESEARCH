name: Research workflow admission guard tests

on:
  push:
    branches: [main, agent/etf-relative-flow-implementation-20261127]
    paths:
      - "README.md"
      - ".github/workflows/**"
      - "research/test_workflow_admission.py"
      - "research/btc_blockspace_fee_rate_source_preflight.py"
      - "research/test_btc_blockspace_fee_rate_source_preflight.py"
      - "research/btc_blockspace_fee_rate_btc_downside.py"
      - "research/test_btc_blockspace_fee_rate_btc_downside.py"
      - "research/etf_relative_flow_source_preflight.py"
      - "research/test_etf_relative_flow_source_preflight.py"
      - "research/etf_relative_flow_ethbtc.py"
      - "research/test_etf_relative_flow_ethbtc.py"
      - "research/persist_etf_relative_flow_evidence.py"
      - "research/test_persist_etf_relative_flow_evidence.py"
      - "research/decision_hierarchy.py"
      - "research/test_decision_hierarchy.py"
      - "research/wikipedia_attention_btc_downside.py"
      - "research/test_wikipedia_attention_btc_downside.py"
      - "research/wikipedia_attention_source_preflight.py"
      - "research/PREREGISTERED-QFR-2026-11-26-WIKIPEDIA-ATTENTION-BTC-DOWNSIDE-01.md"
      - "research/kcprs_policy_skew_dgs2.py"
      - "research/test_kcprs_policy_skew_dgs2.py"
      - "research/wti_shock_sp500_rv.py"
      - "research/test_wti_shock_sp500_rv.py"
      - "research/fed_balance_sheet_btc_downside_semivariance.py"
      - "research/test_fed_balance_sheet_btc_downside_semivariance.py"
      - "research/deribit_relative_dvol_ethbtc_rv.py"
      - "research/test_deribit_relative_dvol_ethbtc_rv.py"
      - "research/mexc_btc_funding_downside.py"
      - "research/test_mexc_btc_funding_downside.py"
      - "research/wikipedia_attention_btc_downside.py"
      - "research/test_wikipedia_attention_btc_downside.py"
      - "research/wikipedia_attention_source_preflight.py"
      - "research/taker_absorption_source_preflight.py"
      - "research/test_taker_absorption_source_preflight.py"
      - "research/taker_absorption_btc_downside.py"
      - "research/test_taker_absorption_btc_downside.py"
      - "research/persist_taker_absorption_evidence.py"
      - "research/test_persist_taker_absorption_evidence.py"
      - "research/PREREGISTERED-QFR-2026-11-27-TAKER-ABSORPTION-BTC-DOWNSIDE-01.md"
      - "research/PREREGISTERED-QFR-2026-11-26-MEXC-BTC-FUNDING-DOWNSIDE-01.md"
      - "research/btc_cross_venue_funding_dispersion_source_preflight.py"
      - "research/test_btc_cross_venue_funding_dispersion_source_preflight.py"
      - "research/PREREGISTERED-QFR-2026-11-27-BTC-CROSS-VENUE-FUNDING-DISPERSION-DOWNSIDE-01.md"
      - "research/PREREGISTERED-QFR-2026-11-27-BTC-BLOCKSPACE-FEERATE-DOWNSIDE-01.md"
      - "research/initial_claims_source_preflight.py"
      - "research/test_initial_claims_source_preflight.py"
      - "research/PREREGISTERED-QFR-2026-11-27-INITIAL-CLAIMS-BTC-DOWNSIDE-01.md"
      - ".github/workflows/initial-claims-source-preflight.yml"
      - "research/initial_claims_btc_downside.py"
      - "research/test_initial_claims_btc_downside.py"
      - ".github/workflows/initial-claims-btc-downside.yml"
      - "research/treasury_rrp_drain_btc_downside.py"
      - "research/test_treasury_rrp_drain_btc_downside.py"
      - "research/PREREGISTERED-QFR-2026-11-27-TREASURY-RRP-DRAIN-BTC-DOWNSIDE-01.md"
      - ".github/workflows/treasury-rrp-drain-btc-downside.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission-guard-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Compile research modules
        run: python -m py_compile research/vxn_vix_cross_index_sp500_rv.py research/test_vxn_vix_cross_index_sp500_rv.py research/kcprs_policy_skew_dgs2.py research/test_kcprs_policy_skew_dgs2.py research/wti_shock_sp500_rv.py research/test_wti_shock_sp500_rv.py research/fed_balance_sheet_btc_downside_semivariance.py research/test_fed_balance_sheet_btc_downside_semivariance.py research/deribit_relative_dvol_ethbtc_rv.py research/test_deribit_relative_dvol_ethbtc_rv.py research/mexc_btc_funding_downside.py research/test_mexc_btc_funding_downside.py research/btc_cross_venue_funding_dispersion_source_preflight.py research/test_btc_cross_venue_funding_dispersion_source_preflight.py research/taker_absorption_source_preflight.py research/test_taker_absorption_source_preflight.py research/taker_absorption_btc_downside.py research/test_taker_absorption_btc_downside.py research/persist_taker_absorption_evidence.py research/test_persist_taker_absorption_evidence.py research/decision_hierarchy.py research/test_decision_hierarchy.py research/btc_blockspace_fee_rate_source_preflight.py research/test_btc_blockspace_fee_rate_source_preflight.py research/btc_blockspace_fee_rate_btc_downside.py research/test_btc_blockspace_fee_rate_btc_downside.py

      - name: Verify every research workflow has the atomic admission gate
        run: python -m unittest discover -s research -p "test_workflow_admission.py" -v

      - name: Run adaptive decision-hierarchy regression tests
        run: PYTHONPATH=research python -m unittest discover -s research -p "test_decision_hierarchy.py" -v

      - name: Run VXN/VIX handoff regression tests
        run: python -m unittest discover -s research -p "test_vxn_vix_cross_index_sp500_rv.py" -v

      - name: Run KC PRS policy-skew regression tests
        run: python -m unittest discover -s research -p "test_kcprs_policy_skew_dgs2.py" -v

      - name: Run WTI repricing regression tests
        run: python -m unittest discover -s research -p "test_wti_shock_sp500_rv.py" -v

      - name: Run Fed balance-sheet and BTC regression tests
        run: python -m unittest discover -s research -p "test_fed_balance_sheet_btc_downside_semivariance.py" -v

      - name: Run Treasury and ON RRP BTC downside regression tests
        run: PYTHONPATH=research python -m unittest discover -s research -p "test_treasury_rrp_drain_btc_downside.py" -v

      - name: Run Deribit relative DVOL regression tests
        run: python -m unittest discover -s research -p "test_deribit_relative_dvol_ethbtc_rv.py" -v

      - name: Run MEXC BTC funding downside regression tests
        run: python -m unittest discover -s research -p "test_mexc_btc_funding_downside.py" -v

      - name: Run cross-venue funding dispersion source-preflight regression tests
        run: PYTHONPATH=research python -m unittest discover -s research -p "test_btc_cross_venue_funding_dispersion_source_preflight.py" -v


      - name: Run Bitcoin Wikipedia-attention downside regression tests
        run: PYTHONPATH=research python -m unittest discover -s research -p "test_wikipedia_attention_btc_downside.py" -v

      - name: Run taker-absorption source-preflight regression tests
        run: PYTHONPATH=research python -m unittest discover -s research -p "test_taker_absorption_source_preflight.py" -v

      - name: Run taker-absorption BTC downside regression tests
        run: PYTHONPATH=research python -m unittest discover -s research -p "test_taker_absorption_btc_downside.py" -v

      - name: Run taker-absorption evidence persistence regression tests
        run: PYTHONPATH=research python -m unittest discover -s research -p "test_persist_taker_absorption_evidence.py" -v
      - name: Compile BTC/ETH ETF relative-flow implementation
        run: python -m py_compile research/etf_relative_flow_source_preflight.py research/test_etf_relative_flow_source_preflight.py research/etf_relative_flow_ethbtc.py research/test_etf_relative_flow_ethbtc.py research/persist_etf_relative_flow_evidence.py research/test_persist_etf_relative_flow_evidence.py

      - name: Run BTC/ETH ETF relative-flow source parser tests
        run: PYTHONPATH=research python -m unittest discover -s research -p "test_etf_relative_flow_source_preflight.py" -v

      - name: Run BTC/ETH ETF relative-flow model tests
        run: PYTHONPATH=research python -m unittest discover -s research -p "test_etf_relative_flow_ethbtc.py" -v

      - name: Run BTC/ETH ETF relative-flow persistence tests
        run: PYTHONPATH=research python -m unittest discover -s research -p "test_persist_etf_relative_flow_evidence.py" -v

      - name: Run Bitcoin blockspace fee-rate source-preflight regression tests
        run: PYTHONPATH=research python -m unittest discover -s research -p "test_btc_blockspace_fee_rate_source_preflight.py" -v

      - name: Run Bitcoin blockspace fee-rate BTC downside regression tests
        run: PYTHONPATH=research python -m unittest discover -s research -p "test_btc_blockspace_fee_rate_btc_downside.py" -v
      - name: Compile initial-claims source preflight
        run: python -m py_compile research/initial_claims_source_preflight.py research/test_initial_claims_source_preflight.py
      - name: Run initial-claims source-preflight regression tests
        run: PYTHONPATH=research python -m unittest discover -s research -p "test_initial_claims_source_preflight.py" -v
      - name: Compile initial-claims BTC downside model
        run: python -m py_compile research/initial_claims_btc_downside.py research/test_initial_claims_btc_downside.py
      - name: Run initial-claims BTC downside model regression tests
        run: PYTHONPATH=research python -m unittest discover -s research -p "test_initial_claims_btc_downside.py" -v
