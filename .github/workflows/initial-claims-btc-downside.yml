name: U.S. initial-claims deterioration and BTC downside-semivariance forecast

on:
  push:
    branches: [main]
    paths:
      - "research/initial_claims_btc_downside.py"
      - "research/test_initial_claims_btc_downside.py"
      - "research/initial_claims_source_preflight.py"
      - "research/test_initial_claims_source_preflight.py"
      - "research/PREREGISTERED-QFR-2026-11-27-INITIAL-CLAIMS-BTC-DOWNSIDE-01.md"
      - ".github/workflows/initial-claims-btc-downside.yml"
  workflow_dispatch:
    inputs:
      source_comment_id:
        description: "Originating control-PR comment ID (set by the authenticated dispatch bridge)"
        required: false
        type: string
      source_control_pr:
        description: "Exact control PR number (set by the authenticated dispatch bridge)"
        required: false
        type: string
      source_actor:
        description: "Verified command author (set by the authenticated dispatch bridge)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: qfr-initial-claims-btc-downside-main
  cancel-in-progress: false

jobs:
  initial-claims-backtest:
    if: github.event_name != 'push' || startsWith(github.event.head_commit.message, '[QFR-ADMIT] research:')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Record authenticated dispatch provenance
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_COMMENT_ID: ${{ inputs.source_comment_id }}
          SOURCE_CONTROL_PR: ${{ inputs.source_control_pr }}
          SOURCE_ACTOR: ${{ inputs.source_actor }}
        run: |
          set -euo pipefail
          printf 'workflow_dispatch source_comment_id=%s source_control_pr=%s source_actor=%s ref=%s sha=%s\\n' \\
            "${SOURCE_COMMENT_ID:-direct-or-unspecified}" \\
            "${SOURCE_CONTROL_PR:-none}" \\
            "${SOURCE_ACTOR:-none}" \\
            "$GITHUB_REF" "$GITHUB_SHA"

      - name: Checkout exact admitted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Assert immutable source checkout
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "Verified source commit: $actual"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Run deterministic source, timing, event, model and admission tests
        run: |
          set -euo pipefail
          python -m py_compile research/initial_claims_source_preflight.py research/test_initial_claims_source_preflight.py research/initial_claims_btc_downside.py research/test_initial_claims_btc_downside.py
          PYTHONPATH=research python -m unittest discover -s research -p "test_initial_claims_source_preflight.py" -v
          PYTHONPATH=research python -m unittest discover -s research -p "test_initial_claims_btc_downside.py" -v
          PYTHONPATH=research python -m unittest discover -s research -p "test_workflow_admission.py" -v

      - name: Retrieve frozen sources and run the one preregistered real-data forecast
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=research python research/initial_claims_btc_downside.py
          pattern="*session-initial-claims-btc-downside-${GITHUB_RUN_ID}.md"
          report="$(find reports/sessions -type f -name "$pattern" | sort | tail -n 1)"
          output="reports/generated/initial-claims-btc-downside/${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          test -n "$report"
          test -s "$report"
          test -s "$output/manifest.json"
          test -s "$output/forecast_rows.csv"
          echo "=== RESEARCH REPORT ==="
          cat "$report"
          echo "=== GENERATED MANIFEST SUMMARY ==="
          python -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); print(json.dumps({k:d.get(k) for k in ("hypothesis_id","status","decision","completed_backtest","validation_metrics","test_metrics","paired_test_loss_bootstrap","error")}, indent=2))' "$output/manifest.json"

      - name: Persist report, manifest, forecast rows and canonical disposition
        if: always()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          pattern="*session-initial-claims-btc-downside-${GITHUB_RUN_ID}.md"
          report="$(find reports/sessions -type f -name "$pattern" | sort | tail -n 1)"
          output="reports/generated/initial-claims-btc-downside/${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          test -n "$report"
          test -s "$report"
          test -s "$output/manifest.json"
          test -s "$output/forecast_rows.csv"
          tmp="$RUNNER_TEMP/qfr-initial-claims-$GITHUB_RUN_ID"
          mkdir -p "$tmp"
          cp "$report" "$tmp/report.md"
          cp "$output/manifest.json" "$tmp/manifest.json"
          cp "$output/forecast_rows.csv" "$tmp/forecast_rows.csv"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$(dirname "$report")" "$output"
            cp "$tmp/report.md" "$report"
            cp "$tmp/manifest.json" "$output/manifest.json"
            cp "$tmp/forecast_rows.csv" "$output/forecast_rows.csv"
            PYTHONPATH=research python -c 'import json,sys; import initial_claims_btc_downside as m; m.update_documents(json.load(open(sys.argv[1], encoding="utf-8")), sys.argv[2], sys.argv[3], sys.argv[4])' "$output/manifest.json" "$report" "$output/manifest.json" "$output/forecast_rows.csv"
            git add "$report" "$output/manifest.json" "$output/forecast_rows.csv" research/HYPOTHESIS-REGISTRY.md research/PREREGISTERED-QFR-2026-11-27-INITIAL-CLAIMS-BTC-DOWNSIDE-01.md
            if git diff --cached --quiet; then
              echo "Evidence already present on main."
              exit 0
            fi
            git commit -m "Persist U.S. initial-claims BTC downside evidence $GITHUB_RUN_ID"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main advanced during evidence persistence; refreshing and retrying."
          done
          echo "Could not persist initial-claims evidence after three main-branch refreshes."
          exit 1

      - name: Require completed empirical evaluation
        if: always()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          manifest="reports/generated/initial-claims-btc-downside/${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}/manifest.json"
          test -s "$manifest"
          python -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); assert d.get("completed_backtest") is True, d.get("error"); assert d.get("decision") in {"PROMISING","REJECTED","INCONCLUSIVE"}, d.get("decision")' "$manifest"
