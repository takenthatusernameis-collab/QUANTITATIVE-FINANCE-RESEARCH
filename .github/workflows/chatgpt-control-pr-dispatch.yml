name: ChatGPT control PR dispatch bridge

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: qfr-control-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 15 &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'takenthatusernameis-collab' &&
      (
        github.event.comment.body == '/qfr-probe-dispatch-bridge' ||
        github.event.comment.body == '/qfr-run-initial-claims-btc-downside' ||
        github.event.comment.body == '/qfr-delete-obsolete-spot-holdout-release'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: write
    steps:
      - name: Dispatch only the exact allowlisted workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          CONTROL_PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          case "$COMMENT_BODY" in
            /qfr-probe-dispatch-bridge)
              workflow_id="dispatch-bridge-probe.yml"
              ;;
            /qfr-run-initial-claims-btc-downside)
              workflow_id="initial-claims-btc-downside.yml"
              ;;
            /qfr-delete-obsolete-spot-holdout-release)
              workflow_id="delete-specific-release.yml"
              ;;
            *)
              echo "Rejected: command is not allowlisted."
              exit 1
              ;;
          esac

          # Successful dispatch leaves a rocket reaction on this exact comment.
          # The PR-level concurrency group serializes deliveries so a replay is a no-op.
          reactions="$(curl --fail-with-body --silent --show-error --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $GH_TOKEN" --header "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$REPOSITORY/issues/comments/$COMMENT_ID/reactions")"
          if printf '%s' "$reactions" | jq -e --arg bot "github-actions[bot]" 'any(.[]; .user.login == $bot and .content == "rocket")' >/dev/null; then
            echo "Duplicate delivery: this comment has already dispatched a workflow."
            exit 0
          fi

          payload="$(jq -cn --arg comment_id "$COMMENT_ID" --arg control_pr "$CONTROL_PR" --arg actor "$COMMENT_AUTHOR" '{ref:"main",inputs:{source_comment_id:$comment_id,source_control_pr:$control_pr,source_actor:$actor}}')"
          echo "Authorized control command: PR=$CONTROL_PR actor=$COMMENT_AUTHOR comment_id=$COMMENT_ID workflow=$workflow_id"

          http_code="$(curl --silent --show-error --output "$RUNNER_TEMP/dispatch-response.json" --write-out '%{http_code}' --request POST --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $GH_TOKEN" --header "X-GitHub-Api-Version: 2022-11-28" --header "Content-Type: application/json" --data "$payload" "https://api.github.com/repos/$REPOSITORY/actions/workflows/$workflow_id/dispatches")"
          if [ "$http_code" != "204" ]; then
            cat "$RUNNER_TEMP/dispatch-response.json"
            echo "Workflow dispatch failed with HTTP $http_code."
            exit 1
          fi

          reaction_http_code="$(curl --silent --show-error --output "$RUNNER_TEMP/reaction-response.json" --write-out '%{http_code}' --request POST --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $GH_TOKEN" --header "X-GitHub-Api-Version: 2022-11-28" --header "Content-Type: application/json" --data '{"content":"rocket"}' "https://api.github.com/repos/$REPOSITORY/issues/comments/$COMMENT_ID/reactions")"
          if [ "$reaction_http_code" != "201" ]; then
            cat "$RUNNER_TEMP/reaction-response.json"
            echo "Could not persist the idempotency reaction; HTTP $reaction_http_code."
            exit 1
          fi
          echo "GitHub accepted $workflow_id workflow_dispatch and persisted the idempotency reaction."
