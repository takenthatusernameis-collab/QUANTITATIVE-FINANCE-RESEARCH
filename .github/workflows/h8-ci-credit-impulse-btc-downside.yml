name: H.8 C&I bank-credit impulse and BTC downside-semivariance forecast

on:
  push:
    branches: [main]
    paths:
      - "research/h8_ci_credit_impulse_btc_downside.py"
      - "research/test_h8_ci_credit_impulse_btc_downside.py"
      - "research/h8_ci_credit_impulse_source_preflight.py"
      - "research/test_h8_ci_credit_impulse_source_preflight.py"
      - "research/test_workflow_admission.py"
      - "research/requirements.txt"
      - "research/PREREGISTERED-QFR-2026-11-28-H8-CI-CREDIT-IMPULSE-BTC-DOWNSIDE-01.md"
      - "research/HYPOTHESIS-REGISTRY.md"
      - "reports/generated/h8-ci-credit-impulse-source-preflight/46115128898-attempt-1/preflight.json"
      - "reports/generated/taker-absorption-btc-downside/45926394994-attempt-1/manifest.json"
      - ".github/workflows/h8-ci-credit-impulse-btc-downside.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qfr-h8-ci-credit-impulse-btc-downside-main
  cancel-in-progress: false

jobs:
  h8-btc-downside-backtest:
    if: github.event_name != 'push' || startsWith(github.event.head_commit.message, '[QFR-ADMIT] research:')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout exact admitted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Assert immutable source checkout
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          echo "Verified immutable admitted source commit: $actual"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install pinned research numerical dependencies
        run: python -m pip install --disable-pip-version-check -r research/requirements.txt

      - name: Run deterministic vintage, archive, event, maturity, bootstrap and admission tests
        run: |
          set -euo pipefail
          python -m py_compile research/h8_ci_credit_impulse_source_preflight.py research/h8_ci_credit_impulse_btc_downside.py research/test_h8_ci_credit_impulse_source_preflight.py research/test_h8_ci_credit_impulse_btc_downside.py
          PYTHONPATH=research python -m unittest discover -s research -p "test_h8_ci_credit_impulse_source_preflight.py" -v
          PYTHONPATH=research python -m unittest discover -s research -p "test_h8_ci_credit_impulse_btc_downside.py" -v
          PYTHONPATH=research python -m unittest discover -s research -p "test_workflow_admission.py" -v

      - name: Run the one preregistered point-in-time H.8 / BTC forecast
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=research python research/h8_ci_credit_impulse_btc_downside.py
          output="reports/generated/h8-ci-credit-impulse-btc-downside/$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          pattern="*session-h8-ci-credit-impulse-btc-downside-$GITHUB_RUN_ID.md"
          report="$(find reports/sessions -type f -name "$pattern" | sort | tail -n 1)"
          test -n "$report"
          test -s "$report"
          test -s "$output/manifest.json"
          test -s "$output/forecast_rows.csv"
          echo "=== H.8 BTC RESEARCH REPORT ==="
          cat "$report"
          echo "=== EMPIRICAL RESULT SUMMARY ==="
          python -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); print(json.dumps({k:d.get(k) for k in ("hypothesis_id","status","decision","completed_backtest","validation_metrics","test_metrics","paired_test_loss_bootstrap","error")}, indent=2))' "$output/manifest.json"

      - name: Persist README, registry, report, manifest and forecast rows to main
        if: always()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          output="reports/generated/h8-ci-credit-impulse-btc-downside/$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          manifest="$output/manifest.json"
          forecasts="$output/forecast_rows.csv"
          pattern="*session-h8-ci-credit-impulse-btc-downside-$GITHUB_RUN_ID.md"
          report="$(find reports/sessions -type f -name "$pattern" | sort | tail -n 1)"
          if [ -z "$report" ] || [ ! -s "$report" ] || [ ! -s "$manifest" ] || [ ! -s "$forecasts" ]; then
            echo "No complete evidence bundle was generated; preserve the primary failure."
            exit 1
          fi
          tmp="$RUNNER_TEMP/qfr-h8-ci-credit-impulse-$GITHUB_RUN_ID"
          mkdir -p "$tmp"
          cp "$report" "$tmp/report.md"
          cp "$manifest" "$tmp/manifest.json"
          cp "$forecasts" "$tmp/forecast_rows.csv"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$(dirname "$report")" "$output"
            cp "$tmp/report.md" "$report"
            cp "$tmp/manifest.json" "$manifest"
            cp "$tmp/forecast_rows.csv" "$forecasts"
            PYTHONPATH=research python -c 'import json,sys; import h8_ci_credit_impulse_btc_downside as m; m.update_documents(json.load(open(sys.argv[1], encoding="utf-8")), sys.argv[2], sys.argv[3], sys.argv[4])' "$manifest" "$report" "$manifest" "$forecasts"
            git add README.md research/HYPOTHESIS-REGISTRY.md "$report" "$manifest" "$forecasts"
            if git diff --cached --quiet; then
              echo "H.8 empirical evidence already present on main."
              exit 0
            fi
            git commit -m "Persist H.8 C&I credit impulse BTC downside evidence $GITHUB_RUN_ID"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main advanced during evidence persistence; refreshing and retrying."
          done
          echo "Could not persist H.8 empirical evidence after three main-branch refreshes."
          exit 1

      - name: Require completed empirical evaluation
        if: always()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          manifest="reports/generated/h8-ci-credit-impulse-btc-downside/$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT/manifest.json"
          test -s "$manifest"
          python -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); assert d.get("completed_backtest") is True, d.get("error"); assert d.get("decision") in {"PROMISING","REJECTED","INCONCLUSIVE"}, d.get("decision")'
