name: MEXC intraday funding dispersion and BTC realized variance forecast

on:
  push:
    branches: [main]
    paths:
      - "research/mexc_funding_dispersion_btc_rv.py"
      - "research/test_mexc_funding_dispersion_btc_rv.py"
      - "research/requirements.txt"
      - "research/PREREGISTERED-QFR-2026-11-27-MEXC-FUNDING-DISPERSION-BTC-RV-01.md"
      - ".github/workflows/mexc-funding-dispersion-btc-rv.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qfr-mexc-funding-dispersion-btc-rv-main
  cancel-in-progress: false

jobs:
  frozen-walk-forward-backtest:
    if: github.event_name != 'push' || startsWith(github.event.head_commit.message, '[QFR-ADMIT] research:')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout exact admitted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Assert immutable source checkout
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "Verified source commit: $actual"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install pinned research numerical dependencies
        run: python -m pip install --disable-pip-version-check -r research/requirements.txt

      - name: Run deterministic model, maturity, bootstrap and admission tests
        run: |
          set -euo pipefail
          python -m py_compile research/mexc_funding_dispersion_source_preflight.py research/mexc_funding_dispersion_btc_rv.py research/test_mexc_funding_dispersion_btc_rv.py
          PYTHONPATH=research python -m unittest discover -s research -p "test_mexc_funding_dispersion_source_preflight.py" -v
          PYTHONPATH=research python -m unittest discover -s research -p "test_mexc_funding_dispersion_btc_rv.py" -v
          PYTHONPATH=research python -m unittest discover -s research -p "test_workflow_admission.py" -v

      - name: Re-fetch frozen MEXC sources and run the one preregistered walk-forward forecast
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=research python research/mexc_funding_dispersion_btc_rv.py

      - name: Persist README, registry, report, manifest and forecast rows to main
        if: always()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          output="reports/generated/mexc-funding-dispersion-btc-rv/$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          manifest="$output/manifest.json"
          forecasts="$output/forecast_rows.csv"
          pattern="*session-mexc-funding-dispersion-btc-rv-$GITHUB_RUN_ID.md"
          report="$(find reports/sessions -type f -name "$pattern" | sort | tail -n 1)"
          if [ -z "$report" ] || [ ! -s "$report" ] || [ ! -s "$manifest" ] || [ ! -s "$forecasts" ]; then
            echo "No complete model evidence bundle was generated; preserve the primary failure."
            exit 0
          fi
          tmp="$RUNNER_TEMP/qfr-mexc-funding-dispersion-model-$GITHUB_RUN_ID"
          mkdir -p "$tmp"
          cp README.md "$tmp/README.md"
          cp research/HYPOTHESIS-REGISTRY.md "$tmp/HYPOTHESIS-REGISTRY.md"
          cp "$report" "$tmp/report.md"
          cp "$manifest" "$tmp/manifest.json"
          cp "$forecasts" "$tmp/forecast_rows.csv"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$(dirname "$report")" "$output"
            cp "$tmp/README.md" README.md
            cp "$tmp/HYPOTHESIS-REGISTRY.md" research/HYPOTHESIS-REGISTRY.md
            cp "$tmp/report.md" "$report"
            cp "$tmp/manifest.json" "$manifest"
            cp "$tmp/forecast_rows.csv" "$forecasts"
            git add README.md research/HYPOTHESIS-REGISTRY.md "$report" "$manifest" "$forecasts"
            if git diff --cached --quiet; then
              echo "Model evidence already present on main."
              exit 0
            fi
            git commit -m "Persist MEXC funding-dispersion BTC RV backtest $GITHUB_RUN_ID"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main advanced during evidence persistence; refreshing and retrying."
          done
          echo "Could not persist MEXC model evidence after three main refreshes."
          exit 1
