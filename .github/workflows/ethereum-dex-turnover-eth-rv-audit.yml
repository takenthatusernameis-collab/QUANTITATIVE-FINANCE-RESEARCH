name: Ethereum DEX turnover / ETH RV independent evidence audit

on:
  push:
    branches: [main]
    paths:
      - "research/audit_ethereum_dex_turnover_eth_rv.py"
      - "research/test_audit_ethereum_dex_turnover_eth_rv.py"
      - ".github/workflows/ethereum-dex-turnover-eth-rv-audit.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: qfr-ethereum-dex-turnover-eth-rv-independent-audit
  cancel-in-progress: false

jobs:
  independent-evidence-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact audit source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Assert immutable source checkout
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "Verified audit source commit: $actual"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install pinned research numerical dependencies
        run: python -m pip install --disable-pip-version-check -r research/requirements.txt

      - name: Compile independent audit and regression tests
        run: python -m py_compile research/audit_ethereum_dex_turnover_eth_rv.py research/test_audit_ethereum_dex_turnover_eth_rv.py

      - name: Run independent audit regression tests
        run: PYTHONPATH=research python -m unittest discover -s research -p "test_audit_ethereum_dex_turnover_eth_rv.py" -v

      - name: Reconstruct the frozen empirical evidence bundle
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: python research/audit_ethereum_dex_turnover_eth_rv.py

      - name: Persist independent audit report and machine-readable result to main
        if: always()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          output="reports/generated/ethereum-dex-turnover-eth-rv-independent-audit/$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          audit="$output/audit.json"
          pattern="*session-ethereum-dex-turnover-eth-rv-independent-audit-$GITHUB_RUN_ID.md"
          report="$(find reports/sessions -type f -name "$pattern" | sort | tail -n 1)"
          if [ -z "$report" ] || [ ! -s "$report" ] || [ ! -s "$audit" ]; then
            echo "No complete audit evidence was generated; preserve the primary failure."
            exit 0
          fi
          tmp="$RUNNER_TEMP/qfr-ethereum-dex-turnover-eth-rv-audit-$GITHUB_RUN_ID"
          mkdir -p "$tmp"
          cp "$report" "$tmp/report.md"
          cp "$audit" "$tmp/audit.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$(dirname "$report")" "$(dirname "$audit")"
            cp "$tmp/report.md" "$report"
            cp "$tmp/audit.json" "$audit"
            git add "$report" "$audit"
            if git diff --cached --quiet; then
              echo "Independent audit evidence already present on main."
              exit 0
            fi
            git commit -m "Persist independent Ethereum DEX ETH RV evidence audit $GITHUB_RUN_ID"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main advanced during audit persistence; refreshing and retrying."
          done
          echo "Could not persist independent audit evidence after three main refreshes."
          exit 1
