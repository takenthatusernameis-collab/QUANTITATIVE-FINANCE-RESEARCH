name: Wikimedia Bitcoin attention and BTC downside-semivariance forecast

on:
  push:
    branches: [main]
    paths:
      - "research/wikipedia_attention_btc_downside.py"
      - "research/test_wikipedia_attention_btc_downside.py"
      - "research/PREREGISTERED-QFR-2026-11-26-WIKIPEDIA-ATTENTION-BTC-DOWNSIDE-01.md"
      - "research/wikipedia_attention_source_preflight.py"
      - "research/treasury_auction_demand.py"
      - "research/stlfsi4_btc_downside_semivariance.py"
      - ".github/workflows/wikipedia-attention-btc-downside.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qfr-wikipedia-attention-btc-downside-main
  cancel-in-progress: false

jobs:
  wikipedia-attention-backtest:
    if: github.event_name != 'push' || startsWith(github.event.head_commit.message, '[QFR-ADMIT] research:')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout exact admitted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Assert immutable source checkout
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "Verified source commit: $actual"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Run deterministic pageview, timing, event, walk-forward and decision tests
        run: |
          set -euo pipefail
          python -m py_compile research/wikipedia_attention_btc_downside.py research/test_wikipedia_attention_btc_downside.py research/wikipedia_attention_source_preflight.py
          PYTHONPATH=research python -m unittest discover -s research -p "test_wikipedia_attention_btc_downside.py" -v
          python -m unittest discover -s research -p "test_workflow_admission.py" -v

      - name: Retrieve frozen Wikimedia and checksummed Binance sources and run the real-data screen
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=research python research/wikipedia_attention_btc_downside.py
          pattern="*session-wikipedia-attention-btc-downside-${GITHUB_RUN_ID}.md"
          report="$(find reports/sessions -type f -name "$pattern" | sort | tail -n 1)"
          manifest="reports/generated/wikipedia-attention-btc-downside/$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT/manifest.json"
          test -n "$report"
          test -s "$report"
          test -s "$manifest"
          echo "=== RESEARCH REPORT ==="
          cat "$report"
          echo "=== GENERATED MANIFEST ==="
          cat "$manifest"

      - name: Persist report, manifest and idempotent registry/preregistration update
        if: success()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          pattern="*session-wikipedia-attention-btc-downside-${GITHUB_RUN_ID}.md"
          report="$(find reports/sessions -type f -name "$pattern" | sort | tail -n 1)"
          manifest="reports/generated/wikipedia-attention-btc-downside/$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT/manifest.json"
          test -n "$report"
          test -s "$report"
          test -s "$manifest"
          tmp="$RUNNER_TEMP/qfr-wikipedia-attention-$GITHUB_RUN_ID"
          mkdir -p "$tmp"
          cp "$report" "$tmp/report.md"
          cp "$manifest" "$tmp/manifest.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$(dirname "$report")" "$(dirname "$manifest")"
            cp "$tmp/report.md" "$report"
            cp "$tmp/manifest.json" "$manifest"
            QFR_MANIFEST="$manifest" QFR_REPORT="$report" PYTHONPATH=research python - <<'PY'
          import json
          import os
          import wikipedia_attention_btc_downside as model

          manifest = os.environ["QFR_MANIFEST"]
          report = os.environ["QFR_REPORT"]
          with open(manifest, encoding="utf-8") as handle:
              result = json.load(handle)
          model.update_documents(result, report, manifest)
          PY
            git add "$report" "$manifest" research/HYPOTHESIS-REGISTRY.md research/PREREGISTERED-QFR-2026-11-26-WIKIPEDIA-ATTENTION-BTC-DOWNSIDE-01.md
            if git diff --cached --quiet; then
              echo "Evidence already present on main."
              exit 0
            fi
            git commit -m "Persist Wikipedia attention BTC downside evidence $GITHUB_RUN_ID"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main advanced during evidence persistence; refreshing and retrying."
          done
          echo "Could not persist Wikipedia-attention evidence after three main-branch refreshes."
          exit 1
