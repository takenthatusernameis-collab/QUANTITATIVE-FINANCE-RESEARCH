name: QFR Actions queue guardian

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - ETH-BTC networked empirical research
      - Trusted Binance archive cache warmer
      - Prospective Binance Spot holdout capture
      - Binance Spot dynamic-universe feasibility audit
    types:
      - completed
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: qfr-queue-guardian
  cancel-in-progress: false

jobs:
  inspect-and-recover:
    name: Enforce 15-minute queued-run policy
    if: >-
      ${{ github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.workflow_id == 425839329 &&
           github.event.workflow_run.event == 'issue_comment' &&
           github.event.workflow_run.head_branch == github.event.repository.default_branch &&
           github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.actor.login == 'takenthatusernameis-collab') ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.name == 'Trusted Binance archive cache warmer' &&
           contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event.workflow_run.event) &&
           github.event.workflow_run.head_branch == github.event.repository.default_branch &&
           github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.actor.login == 'takenthatusernameis-collab') ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.name == 'Prospective Binance Spot holdout capture' &&
           contains(fromJSON('["schedule","workflow_dispatch","issue_comment"]'), github.event.workflow_run.event) &&
           github.event.workflow_run.head_branch == github.event.repository.default_branch &&
           github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.actor.login == 'takenthatusernameis-collab') ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.name == 'Binance Spot dynamic-universe feasibility audit' &&
           github.event.workflow_run.display_title == 'Authorized Binance Spot universe audit' &&
           github.event.workflow_run.event == 'issue_comment' &&
           github.event.workflow_run.head_branch == github.event.repository.default_branch &&
           github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.actor.login == 'takenthatusernameis-collab') ||
          (github.event_name == 'issue_comment' &&
           github.event.action == 'created' &&
           github.event.issue.number == 2 &&
           github.event.issue.pull_request != null &&
           github.event.issue.state == 'open' &&
           github.event.comment.user.login == 'takenthatusernameis-collab' &&
           (github.event.comment.body == '/qfr-queue-guardian-dry-run' ||
            github.event.comment.body == '/qfr-queue-guardian-live')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Inspect queue and persist incident decisions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          DRY_RUN: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_run' && github.event.comment.body != '/qfr-queue-guardian-live' }}
        run: python research/queue_guardian.py

      - name: Upload queue guardian report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qfr-queue-guardian-${{ github.run_id }}
          path: queue_guardian_report.json
          if-no-files-found: warn
          retention-days: 30
