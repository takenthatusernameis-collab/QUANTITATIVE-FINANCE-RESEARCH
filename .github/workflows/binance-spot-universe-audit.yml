name: Binance Spot dynamic-universe feasibility audit

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: binance-spot-universe-audit-main
  cancel-in-progress: false

jobs:
  audit:
    name: Read-only catalogue and archive feasibility probe
    if: >-
      \${{ github.event_name == 'issue_comment' &&
          github.event.action == 'created' &&
          github.event.issue.number == 2 &&
          github.event.issue.pull_request != null &&
          github.event.issue.state == 'open' &&
          github.event.comment.user.login == 'takenthatusernameis-collab' &&
          github.event.comment.body == '/qfr-audit-binance-spot-universe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out repository default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: \${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Verify default-branch execution context
        env:
          DEFAULT_BRANCH: \${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'Verified default-branch SHA: %s\n' "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install minimal HTTP dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir "requests>=2.31,<3"

      - name: Run bounded public-data audit
        run: |
          set -euo pipefail
          python research/binance_spot_universe_audit.py \
            --output-dir "reports/generated/binance-spot-universe-audit-$GITHUB_RUN_ID" \
            --run-id "$GITHUB_RUN_ID"

      - name: Upload compact provenance and normalized metadata only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binance-spot-universe-audit-\${{ github.run_id }}
          path: |
            reports/generated/binance-spot-universe-audit-\${{ github.run_id }}/manifest.json
            reports/generated/binance-spot-universe-audit-\${{ github.run_id }}/catalogue.json
            reports/generated/binance-spot-universe-audit-\${{ github.run_id }}/archive_symbol_prefixes.json
          if-no-files-found: warn
          retention-days: 30
