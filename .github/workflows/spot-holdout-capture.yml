name: Prospective Binance Spot holdout capture

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: none

concurrency:
  group: spot-holdout-capture
  queue: max
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize scheduled, manual or exact control-PR capture
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - name: Validate default branch and exact actor/command
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_IS_PR: ${{ github.event.issue.pull_request != null }}
          ISSUE_STATE: ${{ github.event.issue.state }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          echo "authorized=false" >> "$GITHUB_OUTPUT"
          if [ "$REF" != "refs/heads/main" ]; then
            echo "Rejected non-default branch"
            exit 0
          fi
          case "$EVENT_NAME" in
            schedule)
              ;;
            workflow_dispatch)
              if [ "$ACTOR" != "takenthatusernameis-collab" ]; then
                echo "Rejected manual dispatch actor"
                exit 0
              fi
              ;;
            issue_comment)
              if [ "$EVENT_ACTION" != "created" ] ||
                 [ "$ISSUE_NUMBER" != "2" ] ||
                 [ "$ISSUE_IS_PR" != "true" ] ||
                 [ "$ISSUE_STATE" != "open" ] ||
                 [ "$COMMENT_USER" != "takenthatusernameis-collab" ] ||
                 [ "$COMMENT_BODY" != "/qfr-capture-spot-holdout" ]; then
                echo "Rejected issue-comment event, target, state, actor or command"
                exit 0
              fi
              ;;
            *)
              echo "Rejected unsupported event"
              exit 0
              ;;
          esac
          echo "authorized=true" >> "$GITHUB_OUTPUT"

  capture:
    name: Capture and publish verified Spot holdout
    needs: authorize
    if: ${{ needs.authorize.outputs.authorized == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout default branch only
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'

      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check requests

      - name: Run deterministic capture tests
        run: python -m unittest discover -s research -p "test_spot_holdout_capture.py" -v

      - name: Capture and publish append-only release snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python research/spot_holdout_capture.py \
            --output-dir "reports/generated/spot-holdout-${RUN_ID}" \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --commit-sha "$GITHUB_SHA"

      - name: Upload manifest only
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: spot-holdout-manifest-${{ github.run_id }}
          path: reports/generated/spot-holdout-${{ github.run_id }}/manifest.json
          if-no-files-found: warn
          retention-days: 30
