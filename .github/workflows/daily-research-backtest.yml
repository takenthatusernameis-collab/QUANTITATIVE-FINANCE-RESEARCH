name: Treasury auction demand forecast backtest

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-research-backtest.yml"
      - "research/treasury_auction_demand.py"
      - "research/test_treasury_auction_demand.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qfr-treasury-auction-backtest-main
  cancel-in-progress: false

jobs:
  forecast-backtest:
    # Admit expensive research only from an explicitly complete atomic commit.
    if: github.event_name != 'push' || startsWith(github.event.head_commit.message, '[QFR-ADMIT] research:')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Run deterministic regression tests
        run: python -m unittest discover -s research -p "test_treasury_auction_demand.py" -v

      - name: Retrieve official data and run walk-forward forecast backtest
        id: research
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python research/treasury_auction_demand.py
          echo "=== SESSION REPORT ==="
          report="$(find reports/sessions -type f -name "*session-treasury-auction-${GITHUB_RUN_ID}.md" | sort | tail -n 1)"
          test -n "$report"
          cat "$report"
          echo "=== GENERATED MANIFEST ==="
          cat "reports/generated/treasury-auction-demand/${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}/manifest.json"

      - name: Persist generated research evidence to main
        if: success()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          report="$(find reports/sessions -type f -name "*session-treasury-auction-${GITHUB_RUN_ID}.md" | sort | tail -n 1)"
          manifest="reports/generated/treasury-auction-demand/${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}/manifest.json"
          test -n "$report"
          test -s "$report"
          test -s "$manifest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$report" "$manifest" research/HYPOTHESIS-REGISTRY.md
          if git diff --cached --quiet; then
            echo "No generated evidence changes to persist."
            exit 0
          fi
          git commit -m "Persist Treasury auction research evidence ${GITHUB_RUN_ID}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
