name: Ethereum DEX turnover / ETH realized-variance backtest

on:
  push:
    branches: [main]
    paths:
      - "research/ethereum_dex_turnover_eth_rv.py"
      - "research/test_ethereum_dex_turnover_eth_rv.py"
      - "research/ethereum_dex_turnover_eth_rv_source_preflight.py"
      - "research/test_ethereum_dex_turnover_eth_rv_source_preflight.py"
      - "research/PREREGISTERED-QFR-2026-11-28-ETHEREUM-DEX-TURNOVER-ETH-RV-01.md"
      - "research/test_workflow_admission.py"
      - "research/requirements.txt"
      - ".github/workflows/ethereum-dex-turnover-eth-rv.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: qfr-ethereum-dex-turnover-eth-rv-main
  cancel-in-progress: false

jobs:
  frozen-walk-forward-backtest:
    if: github.event_name != 'push' || startsWith(github.event.head_commit.message, '[QFR-ADMIT] research:')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact admitted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Assert immutable source checkout
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "Verified source commit: $actual"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install pinned research numerical dependencies
        run: python -m pip install --disable-pip-version-check -r research/requirements.txt

      - name: Run deterministic source, model and admission regression tests
        run: |
          set -euo pipefail
          python -m py_compile research/ethereum_dex_turnover_eth_rv_source_preflight.py research/test_ethereum_dex_turnover_eth_rv_source_preflight.py research/ethereum_dex_turnover_eth_rv.py research/test_ethereum_dex_turnover_eth_rv.py
          PYTHONPATH=research python -m unittest discover -s research -p "test_ethereum_dex_turnover_eth_rv_source_preflight.py" -v
          PYTHONPATH=research python -m unittest discover -s research -p "test_ethereum_dex_turnover_eth_rv.py" -v
          PYTHONPATH=research python -m unittest discover -s research -p "test_workflow_admission.py" -v

      - name: Download and verify the exact accepted source-preflight artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id="15243896011"
          expected_zip_sha="5faf791cc3a6c6ef31ede46af0208d41b31ca563cef808190d31634bb5be2d49"
          expected_manifest_sha="1dbf0878593b45b84e9a9e7d9a13ccc3761b10d53510c5852e60da274f62f1c6"
          preflight_run_id="46097000508"
          preflight_source_sha="aa59537e1a7938bddd8b4fd0b64bad4c73f271be"
          artifact_metadata="$RUNNER_TEMP/eth-dex-preflight-artifact.json"
          artifact_zip="$RUNNER_TEMP/eth-dex-preflight-artifact.zip"
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$api" --output "$artifact_metadata"
          jq -e --arg name "ethereum-dex-turnover-eth-rv-source-preflight-$preflight_run_id" \
            --arg sha "$preflight_source_sha" \
            '.expired == false and .name == $name and .workflow_run.head_sha == $sha' \
            "$artifact_metadata" >/dev/null
          curl --fail-with-body --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$api/zip" --output "$artifact_zip"
          actual_zip_sha="$(sha256sum "$artifact_zip" | awk '{print $1}')"
          test "$actual_zip_sha" = "$expected_zip_sha"
          preflight_dir="reports/generated/ethereum-dex-turnover-eth-rv-source-preflight/$preflight_run_id-attempt-1"
          mkdir -p "$preflight_dir"
          unzip -p "$artifact_zip" preflight.json > "$preflight_dir/preflight.json"
          actual_manifest_sha="$(sha256sum "$preflight_dir/preflight.json" | awk '{print $1}')"
          test "$actual_manifest_sha" = "$expected_manifest_sha"
          echo "Verified frozen source-preflight run=$preflight_run_id artifact=$artifact_id manifest_sha256=$actual_manifest_sha"

      - name: Re-fetch frozen sources and run the one preregistered walk-forward forecast
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=research python research/ethereum_dex_turnover_eth_rv.py

      - name: Persist source manifest, report, manifest and forecast rows to main
        if: always()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          output="reports/generated/ethereum-dex-turnover-eth-rv/$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          manifest="$output/manifest.json"
          forecasts="$output/forecast_rows.csv"
          pattern="*session-ethereum-dex-turnover-eth-rv-$GITHUB_RUN_ID.md"
          report="$(find reports/sessions -type f -name "$pattern" | sort | tail -n 1)"
          preflight="reports/generated/ethereum-dex-turnover-eth-rv-source-preflight/46097000508-attempt-1/preflight.json"
          if [ -z "$report" ] || [ ! -s "$report" ] || [ ! -s "$manifest" ] || [ ! -s "$forecasts" ] || [ ! -s "$preflight" ]; then
            echo "No complete evidence bundle was generated; preserve the primary failure."
            exit 0
          fi
          tmp="$RUNNER_TEMP/qfr-ethereum-dex-turnover-eth-rv-$GITHUB_RUN_ID"
          mkdir -p "$tmp"
          cp "$report" "$tmp/report.md"
          cp "$manifest" "$tmp/manifest.json"
          cp "$forecasts" "$tmp/forecast_rows.csv"
          cp "$preflight" "$tmp/preflight.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$(dirname "$report")" "$(dirname "$manifest")" "$(dirname "$preflight")"
            cp "$tmp/report.md" "$report"
            cp "$tmp/manifest.json" "$manifest"
            cp "$tmp/forecast_rows.csv" "$forecasts"
            cp "$tmp/preflight.json" "$preflight"
            git add "$report" "$manifest" "$forecasts" "$preflight"
            if git diff --cached --quiet; then
              echo "Ethereum DEX/ETH RV evidence already present on main."
              exit 0
            fi
            git commit -m "Persist Ethereum DEX turnover ETH RV backtest $GITHUB_RUN_ID"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main advanced during evidence persistence; refreshing and retrying."
          done
          echo "Could not persist Ethereum DEX/ETH RV evidence after three main refreshes."
          exit 1
