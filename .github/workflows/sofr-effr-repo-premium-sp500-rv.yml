name: SOFR-EFFR repo funding premium and S&P 500 realized-volatility forecast

on:
  push:
    branches: [main]
    paths:
      - "research/sofr_effr_repo_premium_sp500_rv.py"
      - "research/test_sofr_effr_repo_premium_sp500_rv.py"
      - ".github/workflows/sofr-effr-repo-premium-sp500-rv.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qfr-sofr-effr-repo-premium-sp500-main
  cancel-in-progress: false

jobs:
  sofr-effr-backtest:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[QFR-ADMIT]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Run deterministic timing, alignment, maturity and decision tests
        run: |
          set -euo pipefail
          python -m unittest discover -s research -p "test_sofr_effr_repo_premium_sp500_rv.py" -v
          python -m unittest discover -s research -p "test_workflow_admission.py" -v

      - name: Retrieve official series and run preregistered walk-forward forecast
        run: |
          set -euo pipefail
          python research/sofr_effr_repo_premium_sp500_rv.py
          report="$(find reports/sessions -type f -name "*session-sofr-effr-repo-premium-$GITHUB_RUN_ID.md" | sort | tail -n 1)"
          manifest="reports/generated/sofr-effr-repo-premium-sp500-rv/$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT/manifest.json"
          test -n "$report"
          test -s "$report"
          test -s "$manifest"
          echo "=== RESEARCH REPORT ==="
          cat "$report"
          echo "=== GENERATED MANIFEST ==="
          cat "$manifest"

      - name: Persist reproducible research evidence to main
        if: success()
        run: |
          set -euo pipefail
          report="$(find reports/sessions -type f -name "*session-sofr-effr-repo-premium-$GITHUB_RUN_ID.md" | sort | tail -n 1)"
          manifest="reports/generated/sofr-effr-repo-premium-sp500-rv/$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT/manifest.json"
          test -n "$report"
          test -s "$report"
          test -s "$manifest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$report" "$manifest" research/HYPOTHESIS-REGISTRY.md research/PREREGISTERED-QFR-2026-11-26-SOFR-EFFR-REPO-PREMIUM-SP500-RV-01.md
          if git diff --cached --quiet; then
            echo "No generated evidence changes to persist."
            exit 0
          fi
          git commit -m "Persist SOFR-EFFR repo premium research evidence $GITHUB_RUN_ID"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
