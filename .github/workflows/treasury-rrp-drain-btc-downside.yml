name: Treasury and ON RRP reserve-drain impulse and BTC downside-semivariance forecast

on:
  push:
    branches: [main]
    paths:
      - "research/treasury_rrp_drain_btc_downside.py"
      - "research/test_treasury_rrp_drain_btc_downside.py"
      - "research/PREREGISTERED-QFR-2026-11-27-TREASURY-RRP-DRAIN-BTC-DOWNSIDE-01.md"
      - ".github/workflows/treasury-rrp-drain-btc-downside.yml"
  workflow_dispatch:
    inputs:
      source_comment_id:
        description: Authenticated source issue-comment ID from the control-PR bridge
        required: true
        type: string
      source_control_pr:
        description: Exact control PR number
        required: true
        type: string
      source_actor:
        description: Verified owner account that authorized the command
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: qfr-treasury-rrp-drain-btc-downside-main
  cancel-in-progress: false

jobs:
  treasury-rrp-drain-backtest:
    if: github.event_name != 'push' || startsWith(github.event.head_commit.message, '[QFR-ADMIT] research:')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout exact admitted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Assert immutable source checkout
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "Verified source commit: $actual"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Record authenticated dispatch provenance
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_COMMENT_ID: ${{ github.event.inputs.source_comment_id }}
          SOURCE_CONTROL_PR: ${{ github.event.inputs.source_control_pr }}
          SOURCE_ACTOR: ${{ github.event.inputs.source_actor }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_COMMENT_ID"
          test "$SOURCE_CONTROL_PR" = "15"
          test "$SOURCE_ACTOR" = "takenthatusernameis-collab"
          echo "Authenticated dispatch provenance: comment=$SOURCE_COMMENT_ID control_pr=$SOURCE_CONTROL_PR actor=$SOURCE_ACTOR"

      - name: Run deterministic parser, timing, event, model and admission tests
        run: |
          set -euo pipefail
          python -m py_compile research/treasury_rrp_drain_btc_downside.py research/test_treasury_rrp_drain_btc_downside.py
          PYTHONPATH=research python -m unittest discover -s research -p "test_treasury_rrp_drain_btc_downside.py" -v
          PYTHONPATH=research python -m unittest discover -s research -p "test_workflow_admission.py" -v

      - name: Retrieve official sources and run the frozen real-data forecast
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          SOURCE_COMMENT_ID: ${{ github.event.inputs.source_comment_id }}
          SOURCE_CONTROL_PR: ${{ github.event.inputs.source_control_pr }}
          SOURCE_ACTOR: ${{ github.event.inputs.source_actor }}
        run: |
          set -euo pipefail
          PYTHONPATH=research python research/treasury_rrp_drain_btc_downside.py
          report="$(find reports/sessions -type f -name "*session-treasury-rrp-drain-btc-$GITHUB_RUN_ID.md" | sort | tail -n 1)"
          manifest="reports/generated/treasury-rrp-drain-btc-downside/$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT/manifest.json"
          test -n "$report"
          test -s "$report"
          test -s "$manifest"
          echo "=== RESEARCH REPORT ==="
          cat "$report"
          echo "=== GENERATED MANIFEST SUMMARY ==="
          python -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); print(json.dumps({k:d.get(k) for k in ("hypothesis_id","status","disposition","completed_backtest","summary_metrics","paired_squared_loss_bootstrap","error")}, indent=2))' "$manifest"

      - name: Persist report, manifest and canonical disposition to main
        if: success()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          report="$(find reports/sessions -type f -name "*session-treasury-rrp-drain-btc-$GITHUB_RUN_ID.md" | sort | tail -n 1)"
          manifest="reports/generated/treasury-rrp-drain-btc-downside/$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT/manifest.json"
          test -n "$report"
          test -s "$report"
          test -s "$manifest"
          tmp="$RUNNER_TEMP/qfr-treasury-rrp-drain-$GITHUB_RUN_ID"
          mkdir -p "$tmp"
          cp "$report" "$tmp/report.md"
          cp "$manifest" "$tmp/manifest.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$(dirname "$report")" "$(dirname "$manifest")"
            cp "$tmp/report.md" "$report"
            cp "$tmp/manifest.json" "$manifest"
            PYTHONPATH=research python -c 'import json,sys; import treasury_rrp_drain_btc_downside as m; m.update_documents(json.load(open(sys.argv[1], encoding="utf-8")), sys.argv[2], sys.argv[3])' "$manifest" "$report" "$manifest"
            git add "$report" "$manifest" research/HYPOTHESIS-REGISTRY.md research/PREREGISTERED-QFR-2026-11-27-TREASURY-RRP-DRAIN-BTC-DOWNSIDE-01.md
            if git diff --cached --quiet; then
              echo "Evidence already present on main."
              exit 0
            fi
            git commit -m "Persist Treasury and ON RRP BTC downside evidence $GITHUB_RUN_ID"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main advanced during evidence persistence; refreshing and retrying."
          done
          echo "Could not persist evidence after three main-branch refreshes."
          exit 1

      - name: Require completed empirical evaluation
        if: always()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          manifest="reports/generated/treasury-rrp-drain-btc-downside/$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT/manifest.json"
          test -s "$manifest"
          python -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); assert d.get("completed_backtest") is True, d.get("error"); assert d.get("status") in {"BACKTESTED","REJECTED","INCONCLUSIVE"}, d.get("status")' "$manifest"
