name: MEXC BTC perpetual funding and next-session Spot downside forecast

on:
  push:
    branches: [main]
    paths:
      - "research/mexc_btc_funding_downside.py"
      - "research/test_mexc_btc_funding_downside.py"
      - "research/PREREGISTERED-QFR-2026-11-26-MEXC-BTC-FUNDING-DOWNSIDE-01.md"
      - ".github/workflows/mexc-btc-funding-downside.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qfr-mexc-btc-funding-downside-main
  cancel-in-progress: false

jobs:
  mexc-btc-funding-backtest:
    if: github.event_name != 'push' || startsWith(github.event.head_commit.message, '[QFR-ADMIT] research:')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout trusted triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Assert immutable source checkout
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "Verified source commit: $actual"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Run deterministic source, pagination, timing, event and decision tests
        run: |
          set -euo pipefail
          python -m py_compile research/mexc_btc_funding_downside.py research/test_mexc_btc_funding_downside.py
          python -m unittest discover -s research -p "test_mexc_btc_funding_downside.py" -v
          python -m unittest discover -s research -p "test_workflow_admission.py" -v

      - name: Retrieve MEXC funding history and checksummed Binance Spot archives
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python research/mexc_btc_funding_downside.py
          report="$(find reports/sessions -type f -name "*session-mexc-btc-funding-$GITHUB_RUN_ID.md" | sort | tail -n 1)"
          manifest="reports/generated/mexc-btc-funding-downside/$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT/manifest.json"
          test -n "$report"
          test -s "$report"
          test -s "$manifest"
          echo "=== RESEARCH REPORT ==="
          cat "$report"
          echo "=== GENERATED MANIFEST ==="
          cat "$manifest"

      - name: Persist evidence and update registry/preregistration with bounded concurrent-update recovery
        if: success()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          report="$(find reports/sessions -type f -name "*session-mexc-btc-funding-$GITHUB_RUN_ID.md" | sort | tail -n 1)"
          manifest="reports/generated/mexc-btc-funding-downside/$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT/manifest.json"
          test -n "$report"
          test -s "$report"
          test -s "$manifest"
          tmp="$RUNNER_TEMP/qfr-mexc-btc-funding-$GITHUB_RUN_ID"
          mkdir -p "$tmp"
          cp "$report" "$tmp/report.md"
          cp "$manifest" "$tmp/manifest.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$(dirname "$report")" "$(dirname "$manifest")"
            cp "$tmp/report.md" "$report"
            cp "$tmp/manifest.json" "$manifest"
            PYTHONPATH=research python -c 'import json,sys; import mexc_btc_funding_downside as m; m.update_documents(json.load(open(sys.argv[1], encoding="utf-8")), sys.argv[2], sys.argv[3])' "$manifest" "$report" "$manifest"
            git add "$report" "$manifest" research/HYPOTHESIS-REGISTRY.md research/PREREGISTERED-QFR-2026-11-26-MEXC-BTC-FUNDING-DOWNSIDE-01.md
            if git diff --cached --quiet; then
              echo "Evidence already present on main."
              exit 0
            fi
            git commit -m "Persist MEXC BTC funding downside evidence $GITHUB_RUN_ID"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main advanced during evidence persistence; refreshing and retrying."
          done
          echo "Could not persist MEXC funding evidence after three main-branch refreshes."
          exit 1
