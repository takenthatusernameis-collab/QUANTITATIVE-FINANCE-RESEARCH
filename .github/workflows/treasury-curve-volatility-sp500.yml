name: Treasury yield-curve volatility and S&P 500 realized-volatility forecast

on:
  push:
    branches: [main]
    paths:
      - "research/treasury_curve_volatility_sp500.py"
      - "research/test_treasury_curve_volatility_sp500.py"
      - ".github/workflows/treasury-curve-volatility-sp500.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qfr-treasury-curve-volatility-main
  cancel-in-progress: false

jobs:
  curve-volatility-backtest:
    # Admit expensive research only from an explicitly complete atomic commit.
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[QFR-ADMIT]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Run deterministic signed-spread, strict-lag, gap and leakage tests
        run: python -m unittest discover -s research -p "test_treasury_curve_volatility_sp500.py" -v

      - name: Retrieve public series and run preregistered walk-forward forecast
        run: |
          set -euo pipefail
          python research/treasury_curve_volatility_sp500.py
          report="$(find reports/sessions -type f -name "*session-treasury-curve-volatility-$GITHUB_RUN_ID.md" | sort | tail -n 1)"
          manifest="reports/generated/treasury-curve-volatility/$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT/manifest.json"
          test -n "$report"
          test -s "$report"
          test -s "$manifest"
          echo "=== SESSION REPORT ==="
          cat "$report"
          echo "=== GENERATED MANIFEST ==="
          cat "$manifest"

      - name: Persist reproducible research evidence to main
        if: success()
        run: |
          set -euo pipefail
          report="$(find reports/sessions -type f -name "*session-treasury-curve-volatility-$GITHUB_RUN_ID.md" | sort | tail -n 1)"
          manifest="reports/generated/treasury-curve-volatility/$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT/manifest.json"
          test -n "$report"
          test -s "$report"
          test -s "$manifest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$report" "$manifest" research/HYPOTHESIS-REGISTRY.md
          if git diff --cached --quiet; then
            echo "No generated evidence changes to persist."
            exit 0
          fi
          git commit -m "Persist Treasury curve-volatility research evidence $GITHUB_RUN_ID"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
