name: Research pipeline tests

on:
  push:
    paths:
      - "research/**"
      - "README.md"
      - "docs/**"
      - "tasks/**"
      - "reports/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "research/**"
      - "README.md"
      - "docs/**"
      - "tasks/**"
      - "reports/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-tests-main
  queue: max
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Run deterministic unit tests
        run: python -m unittest discover -s research -p "test_*.py" -v
      - name: Run synthetic plumbing smoke test
        run: python research/run_eth_btc.py --self-test
