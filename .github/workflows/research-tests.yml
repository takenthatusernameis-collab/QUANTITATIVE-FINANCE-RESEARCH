name: Research pipeline tests

on:
  push:
    paths:
      - "research/**"
      - ".github/workflows/research-tests.yml"
      - ".github/workflows/eth-btc-research.yml"
      - ".github/workflows/queue-guardian.yml"
  pull_request:
    paths:
      - "research/**"
      - ".github/workflows/research-tests.yml"
      - ".github/workflows/queue-guardian.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-tests-main
  queue: max
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Run deterministic unit tests
        run: python -m unittest discover -s research -p "test_*.py" -v
      - name: Run synthetic plumbing smoke test
        run: python research/run_eth_btc.py --self-test
