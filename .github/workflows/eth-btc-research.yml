name: ETH-BTC networked empirical research

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode (historical backtests can also be agent-triggered after preflight validation)
        required: true
        default: empirical
        type: choice
        options:
          - empirical
          - audit-only
      start:
        description: Inclusive UTC start date (YYYY-MM-DD)
        required: true
        default: '2020-01-01'
        type: string
      end:
        description: Inclusive UTC end date (YYYY-MM-DD)
        required: true
        default: '2026-10-31'
        type: string
      market:
        description: Market selection for empirical mode (audit-only always audits both)
        required: true
        default: both
        type: choice
        options:
          - spot
          - um
          - both
      reconcile_spot_gaps:
        description: In audit-only mode, reconcile missing ETH Spot hours against official REST and daily archives
        required: true
        default: false
        type: boolean
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'issue_comment' && (github.event.action != 'created' || github.event.issue.number != 2 || github.event.issue.pull_request == null || github.event.issue.state != 'open' || github.event.comment.user.login != 'takenthatusernameis-collab' || !contains(fromJSON('["/qfr-control-smoke","/qfr-run-eth-btc-data-audit","/qfr-probe-eth-btc-funding-2024-01","/qfr-probe-tardis-funding-2024-01-01","/qfr-probe-tardis-funding-2020-06-01","/qfr-probe-tardis-funding-2025-06-01","/qfr-probe-tardis-funding-2025-10-01","/qfr-probe-tardis-funding-2026-02-01","/qfr-probe-tardis-funding-2026-03-01","/qfr-probe-mexc-funding-history","/qfr-probe-bybit-funding-history","/qfr-probe-bitget-funding-download","/qfr-probe-okx-funding-download","/qfr-probe-okx-funding-button","/qfr-probe-okx-funding-field-info","/qfr-probe-okx-funding-symbols","/qfr-probe-kraken-funding-export","/qfr-audit-kraken-residual-anomalies","/qfr-audit-kraken-rate-cap-census","/qfr-audit-kraken-tardis-timestamp-mapping","/qfr-audit-kraken-tardis-gap-events","/qfr-audit-kraken-pi-price-validation","/qfr-run-eth-btc-empirical","/qfr-run-eth-btc-spot-empirical","/qfr-run-eth-btc-um-empirical","/qfr-run-eth-btc-spot-momentum"]'), github.event.comment.body)) && format('eth-btc-research-ignored-{0}', github.event.comment.id) || 'eth-btc-research-main' }}
  queue: max
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize requested operation
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'issue_comment' }}
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      command: ${{ steps.gate.outputs.command }}
      start: ${{ steps.gate.outputs.start }}
      end: ${{ steps.gate.outputs.end }}
      market: ${{ steps.gate.outputs.market }}
      reconcile: ${{ steps.gate.outputs.reconcile }}
    steps:
      - name: Validate event, target, actor and exact command
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_IS_PR: ${{ github.event.issue.pull_request != null }}
          ISSUE_STATE: ${{ github.event.issue.state }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_START: ${{ inputs.start }}
          DISPATCH_END: ${{ inputs.end }}
          DISPATCH_MARKET: ${{ inputs.market }}
          DISPATCH_RECONCILE: ${{ inputs.reconcile_spot_gaps }}
        run: |
          set -euo pipefail
          echo "authorized=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="${DISPATCH_MODE:-empirical}"
            case "$MODE" in
              empirical) COMMAND="empirical" ;;
              audit-only) COMMAND="audit" ;;
              *) echo "Rejected unsupported dispatch mode"; exit 0 ;;
            esac
            START="${DISPATCH_START:-2020-01-01}"
            END="${DISPATCH_END:-2026-10-31}"
            MARKET="${DISPATCH_MARKET:-both}"
            RECONCILE="${DISPATCH_RECONCILE:-false}"
            if [[ ! "$START" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || [[ ! "$END" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "Rejected malformed date input"; exit 0
            fi
            case "$MARKET" in spot|um|both) ;; *) echo "Rejected market input"; exit 0 ;; esac
            case "$RECONCILE" in true|false) ;; *) RECONCILE="false" ;; esac
          elif [ "$EVENT_NAME" = "issue_comment" ]; then
            # This PR is only an event surface. GitHub executes the default-branch workflow;
            # no PR-head source, files, or data are checked out or trusted.
            if [ "$EVENT_ACTION" != "created" ] ||
               [ "$ISSUE_NUMBER" != "2" ] ||
               [ "$ISSUE_IS_PR" != "true" ] ||
               [ "$ISSUE_STATE" != "open" ] ||
               [ "$COMMENT_USER" != "takenthatusernameis-collab" ]; then
              echo "Rejected event, target, state, or actor"; exit 0
            fi
            START="2020-01-01"
            END="2026-10-31"
            MARKET="both"
            RECONCILE="true"
            case "$COMMENT_BODY" in
              "/qfr-control-smoke") COMMAND="smoke" ;;
              "/qfr-run-eth-btc-data-audit") COMMAND="audit" ;;
              "/qfr-probe-eth-btc-funding-2024-01")
                # One-month, audit-only probe of all six inputs; never an empirical run.
                COMMAND="audit"
                START="2024-01-01"
                END="2024-01-31"
                RECONCILE="false"
                ;;
              "/qfr-probe-tardis-funding-2024-01-01")
                # One free first-of-month sample; schedule/estimate probe only, never empirical.
                COMMAND="tardis-probe"
                START="2024-01-01"
                END="2024-01-01"
                MARKET="both"
                RECONCILE="false"
                ;;
              "/qfr-probe-tardis-funding-2020-06-01")
                COMMAND="tardis-probe"
                START="2020-06-01"
                END="2020-06-01"
                MARKET="both"
                RECONCILE="false"
                ;;
              "/qfr-probe-tardis-funding-2025-06-01")
                COMMAND="tardis-probe"
                START="2025-06-01"
                END="2025-06-01"
                MARKET="both"
                RECONCILE="false"
                ;;
              "/qfr-probe-tardis-funding-2025-10-01")
                COMMAND="tardis-probe"
                START="2025-10-01"
                END="2025-10-01"
                MARKET="both"
                RECONCILE="false"
                ;;
              "/qfr-probe-tardis-funding-2026-02-01")
                COMMAND="tardis-probe"
                START="2026-02-01"
                END="2026-02-01"
                MARKET="both"
                RECONCILE="false"
                ;;
              "/qfr-probe-tardis-funding-2026-03-01")
                COMMAND="tardis-probe"
                START="2026-03-01"
                END="2026-03-01"
                MARKET="both"
                RECONCILE="false"
                ;;
              "/qfr-probe-mexc-funding-history")
                # Independent public-provider funding pagination pilot; never Binance evidence or a backtest.
                COMMAND="mexc-probe"
                START="2020-01-01"
                END="2026-10-31"
                MARKET="both"
                RECONCILE="false"
                ;;
              "/qfr-probe-bybit-funding-history")
                # Bounded public Bybit samples only; independent venue, no backtest.
                COMMAND="bybit-probe"
                START="2020-01-01"
                END="2026-11-22"
                MARKET="both"
                RECONCILE="false"
                ;;
              "/qfr-probe-bitget-funding-download")
                # Anonymous, bounded UI inspection of the public funding-history download page.
                COMMAND="bitget-probe"
                START="2020-01-01"
                END="2026-10-31"
                MARKET="both"
                RECONCILE="false"
                ;;
              "/qfr-probe-okx-funding-download")
                COMMAND="okx-probe"
                START="2022-03-01"
                END="2026-10-31"
                MARKET="both"
                RECONCILE="false"
                ;;
              "/qfr-probe-okx-funding-button")
                # Inspect only the Funding rate card; cancel direct downloads immediately.
                COMMAND="okx-button-probe"
                START="2022-03-01"
                END="2026-11-22"
                MARKET="both"
                RECONCILE="false"
                ;;
              "/qfr-probe-okx-funding-field-info")
                # Open the funding modal and inspect only its Field information control.
                COMMAND="okx-field-info-probe"
                START="2022-03-01"
                END="2026-11-22"
                MARKET="both"
                RECONCILE="false"
                ;;
              "/qfr-probe-okx-funding-symbols")
                # Open the Symbol selector only; do not select any instrument.
                COMMAND="okx-symbol-options-probe"
                START="2022-03-01"
                END="2026-11-22"
                MARKET="both"
                RECONCILE="false"
                ;;
              "/qfr-probe-kraken-funding-export")
                # Download the public Kraken ZIP only to ephemeral runner storage; upload a manifest/screenshot, never raw market data.
                COMMAND="kraken-export-probe"
                START="2018-01-01"
                END="2026-11-23"
                MARKET="both"
                RECONCILE="false"
                ;;
              "/qfr-audit-kraken-residual-anomalies")
                # Inspect only four exact BTC/ETH perpetual CSVs and timestamped API extrema; raw data stay ephemeral.
                COMMAND="kraken-anomaly-audit"
                START="2018-01-01"
                END="2026-11-23"
                MARKET="both"
                RECONCILE="false"
                ;;
              "/qfr-audit-kraken-rate-cap-census")
                # Query all four public API histories only; no archive download, browser, or raw-row artifact.
                COMMAND="kraken-api-cap-audit"
                START="2018-01-01"
                END="2026-11-23"
                MARKET="both"
                RECONCILE="false"
                ;;
              "/qfr-audit-kraken-tardis-timestamp-mapping")
                # One no-key Tardis first-of-month PI sample plus matching public Kraken API histories; no archive or raw-data artifact.
                COMMAND="kraken-tardis-timestamp-audit"
                START="2026-10-01"
                END="2026-10-01"
                MARKET="both"
                RECONCILE="false"
                ;;
              "/qfr-audit-kraken-tardis-gap-events")
                # Five known PI API gaps plus the 2026-10-30 delisting boundary; public no-key Tardis only.
                COMMAND="kraken-tardis-gap-audit"
                START="2025-12-04"
                END="2026-10-30"
                MARKET="both"
                RECONCILE="false"
                ;;
              "/qfr-audit-kraken-pi-price-validation")
                # Four bounded Coinbase Exchange hourly windows; no Kraken archive/API re-download or backtest.
                COMMAND="kraken-pi-price-validation"
                START="2026-08-20"
                END="2026-10-30"
                MARKET="both"
                RECONCILE="false"
                ;;
              "/qfr-run-eth-btc-empirical") COMMAND="empirical" ;;
              "/qfr-run-eth-btc-spot-empirical") COMMAND="empirical"; MARKET="spot" ;;
              "/qfr-run-eth-btc-um-empirical") COMMAND="empirical"; MARKET="um" ;;
              "/qfr-run-eth-btc-spot-momentum")
                # Frozen Spot-only momentum study; no funding data or PR-head code is used.
                COMMAND="spot-momentum"
                START="2020-01-01"
                END="2026-10-31"
                MARKET="spot"
                RECONCILE="true"
                ;;
              *) echo "Rejected non-allowlisted command"; exit 0 ;;
            esac
          else
            echo "Rejected unsupported event"; exit 0
          fi
          echo "authorized=true" >> "$GITHUB_OUTPUT"
          echo "command=$COMMAND" >> "$GITHUB_OUTPUT"
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"
          echo "market=$MARKET" >> "$GITHUB_OUTPUT"
          echo "reconcile=$RECONCILE" >> "$GITHUB_OUTPUT"
          echo "Authorized command: $COMMAND"

  control-smoke:
    name: Harmless ChatGPT dispatch smoke test
    needs: authorize
    if: ${{ needs.authorize.outputs.authorized == 'true' && needs.authorize.outputs.command == 'smoke' }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm authorization without executing repository or PR code
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMAND: ${{ needs.authorize.outputs.command }}
        run: |
          set -euo pipefail
          echo "CONTROL SMOKE PASS"
          echo "event=$EVENT_NAME"
          echo "actor=$ACTOR"
          echo "control_pr=$ISSUE_NUMBER"
          echo "command=$COMMAND"
          echo "No checkout, code execution, data retrieval, or research was performed."

  empirical-research:
    name: Run authorized data audit or empirical study
    needs: authorize
    if: ${{ needs.authorize.outputs.authorized == 'true' && (needs.authorize.outputs.command == 'audit' || needs.authorize.outputs.command == 'empirical') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/requirements.txt

      - name: Cache Binance archives
        # issue_comment is low-trust and defaults to read-only cache access.
        # Do not override with cache-mode: write here; use a separate trusted cache warmer.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/cache/
          # Unique primary keys prevent immutable old snapshots shadowing newer warm caches.
          key: binance-archives-run-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            binance-archives-warm-
            binance-archives-run-
            binance-archives-

      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt

      - name: Run synthetic plumbing test
        run: python research/run_eth_btc.py --self-test

      - name: Run non-fail-fast all-series data audit
        if: ${{ needs.authorize.outputs.command == 'audit' }}
        env:
          START_DATE: ${{ needs.authorize.outputs.start }}
          END_DATE: ${{ needs.authorize.outputs.end }}
          RECONCILE: ${{ needs.authorize.outputs.reconcile }}
        run: |
          set -euo pipefail
          args=()
          if [ "$RECONCILE" = "true" ]; then
            args+=(--reconcile-spot-gaps)
          fi
          python research/run_eth_btc.py \
            --start "$START_DATE" \
            --end "$END_DATE" \
            --market both \
            --data-dir data \
            --output-dir reports/generated \
            --audit-only \
            "${args[@]}"

      - name: Run non-fail-fast all-series preflight before empirical backtest
        if: ${{ needs.authorize.outputs.command == 'empirical' }}
        env:
          START_DATE: ${{ needs.authorize.outputs.start }}
          END_DATE: ${{ needs.authorize.outputs.end }}
          MARKET: ${{ needs.authorize.outputs.market }}
        run: |
          set -euo pipefail
          args=()
          if [ "$MARKET" != "um" ]; then
            args+=(--reconcile-spot-gaps)
          fi
          python research/run_eth_btc.py \
            --start "$START_DATE" \
            --end "$END_DATE" \
            --market "$MARKET" \
            --data-dir data \
            --output-dir reports/generated \
            --audit-only \
            "${args[@]}"

      - name: Run full historical empirical study (agent-triggered when authorized)
        if: ${{ needs.authorize.outputs.command == 'empirical' }}
        env:
          START_DATE: ${{ needs.authorize.outputs.start }}
          END_DATE: ${{ needs.authorize.outputs.end }}
          MARKET: ${{ needs.authorize.outputs.market }}
        run: |
          set -euo pipefail
          python research/run_eth_btc.py \
            --start "$START_DATE" \
            --end "$END_DATE" \
            --market "$MARKET" \
            --data-dir data \
            --output-dir reports/generated

      - name: Upload research outputs and manifests (never raw CSV market data)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eth-btc-research-${{ github.run_number }}
          path: |
            reports/generated/
            data/raw/*_archive_manifest.json
            data/raw/*_funding_manifest.json
            data/raw/spot_*_gap_reconciliation.json
          if-no-files-found: warn
          retention-days: 30
  spot-momentum-research:
    name: Run preregistered Spot momentum research
    needs: authorize
    if: ${{ needs.authorize.outputs.authorized == 'true' && needs.authorize.outputs.command == 'spot-momentum' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/requirements.txt

      - name: Restore verified Binance Spot archive cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/cache/
          key: binance-archives-momentum-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            binance-archives-warm-
            binance-archives-run-
            binance-archives-

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check -r research/requirements.txt

      - name: Run frozen Spot-only momentum study
        env:
          START_DATE: ${{ needs.authorize.outputs.start }}
          END_DATE: ${{ needs.authorize.outputs.end }}
        run: |
          set -euo pipefail
          python research/spot_momentum.py \
            --start "$START_DATE" \
            --end "$END_DATE" \
            --data-dir data \
            --output-dir reports/generated/spot-momentum

      - name: Upload momentum outputs and Spot provenance only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eth-btc-spot-momentum-${{ github.run_number }}
          path: |
            reports/generated/spot-momentum/
            data/raw/spot_*_archive_manifest.json
            data/raw/spot_*_gap_reconciliation.json
          if-no-files-found: warn
          retention-days: 30

  tardis-funding-probe:
    name: Probe Tardis free funding schedule sample
    needs: authorize
    if: ${{ needs.authorize.outputs.authorized == 'true' && needs.authorize.outputs.command == 'tardis-probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Download and audit Tardis free sample
        env:
          SAMPLE_DATE: ${{ needs.authorize.outputs.start }}
        run: |
          set -euo pipefail
          python research/tardis_funding_probe.py \
            --date "$SAMPLE_DATE" \
            --symbols ETHUSDT,BTCUSDT \
            --output-dir "reports/generated/tardis-funding-probe-$SAMPLE_DATE" \
            --cache-dir "data/cache/tardis-funding-probe-$SAMPLE_DATE"

      - name: Upload Tardis sample and manifests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tardis-funding-probe-${{ github.run_id }}
          path: reports/generated/tardis-funding-probe-${{ needs.authorize.outputs.start }}/*.json
          if-no-files-found: warn
          retention-days: 30
  mexc-funding-probe:
    name: Probe MEXC public funding-history pagination
    needs: authorize
    if: ${{ needs.authorize.outputs.authorized == 'true' && needs.authorize.outputs.command == 'mexc-probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Download and audit MEXC funding history
        env:
          MEXC_SYMBOLS: BTC_USDT,ETH_USDT
          PAGE_SIZE: '1000'
          MAX_PAGES: '200'
          MAX_RECORDS: '200000'
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python research/mexc_funding_probe.py \
            --symbols "$MEXC_SYMBOLS" \
            --page-size "$PAGE_SIZE" \
            --max-pages "$MAX_PAGES" \
            --max-records "$MAX_RECORDS" \
            --output-dir "reports/generated/mexc-funding-probe-$RUN_ID" \
            --cache-dir "data/cache/mexc-funding-probe-$RUN_ID"

      - name: Upload MEXC manifests (never raw pages)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mexc-funding-probe-${{ github.run_id }}
          path: reports/generated/mexc-funding-probe-${{ github.run_id }}/*.json
          if-no-files-found: warn
          retention-days: 30
  bybit-funding-probe:
    name: Probe Bybit public funding-history samples
    needs: authorize
    if: ${{ needs.authorize.outputs.authorized == 'true' && needs.authorize.outputs.command == 'bybit-probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Download and audit bounded Bybit funding samples
        env:
          BYBIT_SYMBOLS: BTCUSDT,ETHUSDT
          LIMIT: '200'
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python research/bybit_funding_probe.py \
            --symbols "$BYBIT_SYMBOLS" \
            --limit "$LIMIT" \
            --output-dir "reports/generated/bybit-funding-probe-$RUN_ID" \
            --cache-dir "data/cache/bybit-funding-probe-$RUN_ID"

      - name: Upload Bybit sample manifests (never raw responses)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bybit-funding-probe-${{ github.run_id }}
          path: reports/generated/bybit-funding-probe-${{ github.run_id }}/*.json
          if-no-files-found: warn
          retention-days: 30

  bitget-funding-download-probe:
    name: Inspect official funding-history download UI (anonymous, read-only)
    needs: authorize
    if: ${{ needs.authorize.outputs.authorized == 'true' && (needs.authorize.outputs.command == 'bitget-probe' || needs.authorize.outputs.command == 'okx-probe') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_URL: ${{ needs.authorize.outputs.command == 'bitget-probe' && 'https://www.bitget.com/trade-info/funding_rate' || 'https://www.okx.com/historical-data' }}
    steps:
      - name: Checkout repository default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: python -m pip install --no-cache-dir playwright==1.65.0

      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Probe public funding-history UI without credentials
        run: python research/bitget_funding_download_probe.py --url "$TARGET_URL" --output-dir "reports/generated/funding-ui-probe-${{ github.run_id }}"

      - name: Upload UI evidence only (no raw downloads)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: funding-ui-probe-${{ github.run_id }}
          path: |
            reports/generated/funding-ui-probe-${{ github.run_id }}/manifest.json
            reports/generated/funding-ui-probe-${{ github.run_id }}/*.png
          if-no-files-found: warn
          retention-days: 30
  kraken-funding-export-probe:
    name: Inspect Kraken public historical funding export (ephemeral only)
    needs: authorize
    if: ${{ needs.authorize.outputs.authorized == 'true' && (needs.authorize.outputs.command == 'kraken-export-probe' || needs.authorize.outputs.command == 'kraken-anomaly-audit') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install Playwright and HTTP client
        run: |
          python -m pip install --no-cache-dir playwright==1.65.0 "requests>=2.31"

      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Download and inspect the official Kraken archive in temporary storage
        run: |
          MODE=export
          if [ "${{ needs.authorize.outputs.command }}" = "kraken-anomaly-audit" ]; then
            MODE=anomaly-audit
          fi
          python research/kraken_funding_export_probe.py --mode "$MODE" --output-dir "reports/generated/kraken-funding-${{ needs.authorize.outputs.command }}-${{ github.run_id }}"

      - name: Upload compact evidence only (never raw ZIP or CSV)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kraken-funding-${{ needs.authorize.outputs.command }}-${{ github.run_id }}
          path: |
            reports/generated/kraken-funding-${{ needs.authorize.outputs.command }}-${{ github.run_id }}/manifest.json
            reports/generated/kraken-funding-${{ needs.authorize.outputs.command }}-${{ github.run_id }}/*.png
          if-no-files-found: warn
          retention-days: 30

  kraken-api-cap-audit:
    name: Census every Kraken public API relative-rate row against date-specific caps
    needs: authorize
    if: ${{ needs.authorize.outputs.authorized == 'true' && needs.authorize.outputs.command == 'kraken-api-cap-audit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

