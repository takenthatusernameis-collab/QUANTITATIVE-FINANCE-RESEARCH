        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install HTTP client only
        run: python -m pip install --no-cache-dir "requests>=2.31"

      - name: Query four exact public Kraken funding histories without archive download
        run: |
          set -euo pipefail
          python research/kraken_funding_export_probe.py \
            --mode api-cap-audit \
            --output-dir "reports/generated/kraken-api-cap-audit-${{ github.run_id }}"

      - name: Upload manifest only (never raw API rows)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
