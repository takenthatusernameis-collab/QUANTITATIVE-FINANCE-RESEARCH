name: Trusted Binance archive cache warmer

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  # Narrow trusted push path: validate the warmer immediately after it reaches main.
  push:
    branches: [main]
    paths:
      - .github/workflows/eth-btc-cache-warm.yml
      - research/run_eth_btc.py
      - research/requirements.txt

permissions:
  contents: read

concurrency:
  group: binance-archive-cache-warm
  cancel-in-progress: false

jobs:
  warm-cache:
    name: Warm one representative month of Binance archives
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository default branch only
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'

      - name: Restore prior verified Binance archive cache
        id: cache-restore
        uses: actions/cache/restore@v6.1.0
        with:
          path: data/cache/
          key: binance-archives-warm-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            binance-archives-warm-
            binance-archives-run-
            binance-archives-

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check -r research/requirements.txt

      - name: Run bounded audit-only representative-month warm-up
        id: audit
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          python research/run_eth_btc.py \
            --start 2024-01-01 \
            --end 2024-01-31 \
            --market both \
            --data-dir data \
            --output-dir "reports/generated/cache-warm-${RUN_ID}" \
            --audit-only
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "Audit failed with unexpected exit code $status" >&2
            exit "$status"
          fi
          echo "audit_exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "Exit 2 is an expected fail-closed research-gate result for this no-reconciliation cache pilot."

      - name: Validate all six manifests and archive checksums
        id: validate
        env:
          RUN_ID: ${{ github.run_id }}
          AUDIT_EXIT_CODE: ${{ steps.audit.outputs.audit_exit_code }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          raw = Path("data/raw")
          expected = [
              "spot_ETHUSDT_archive_manifest.json",
              "spot_BTCUSDT_archive_manifest.json",
              "um_ETHUSDT_archive_manifest.json",
              "um_BTCUSDT_archive_manifest.json",
              "um_ETHUSDT_funding_manifest.json",
              "um_BTCUSDT_funding_manifest.json",
          ]
          records = []
          for name in expected:
              path = raw / name
              if not path.is_file():
                  raise SystemExit(f"Missing required manifest: {path}")
              payload = json.loads(path.read_text(encoding="utf-8"))
              archives = payload.get("archives", [])
              if len(archives) != 1:
                  raise SystemExit(
                      f"{name}: expected exactly one January 2024 archive; found {len(archives)}"
                  )
              archive = archives[0]
              if archive.get("checksum_verified") is not True:
                  raise SystemExit(f"{name}: archive checksum was not verified")
              if archive.get("status") not in {"downloaded", "downloaded_checksum_verified"}:
                  raise SystemExit(f"{name}: unexpected archive status {archive.get('status')!r}")
              if not archive.get("archive_sha256"):
                  raise SystemExit(f"{name}: archive SHA-256 is missing")
              records.append({
                  "manifest": name,
                  "manifest_sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "archive_status": archive.get("status"),
                  "archive_sha256": archive["archive_sha256"],
                  "checksum_verified": True,
                  "rows": archive.get("rows"),
              })

          cache_root = Path("data/cache")
          cache_files = [p for p in cache_root.rglob("*") if p.is_file()] if cache_root.exists() else []
          archive_files = [p for p in cache_files if p.suffix.lower() == ".zip"]
          if len(archive_files) < 6:
              raise SystemExit(
                  f"Expected at least six cached archive ZIPs; found {len(archive_files)}"
              )
          cache_bytes = sum(p.stat().st_size for p in cache_files)
          report_dir = Path("reports/generated") / f"cache-warm-{os.environ['RUN_ID']}"
          report_dir.mkdir(parents=True, exist_ok=True)
          audit_path = report_dir / "data_audit_summary.json"
          if not audit_path.is_file():
              raise SystemExit("The audit summary is missing")
          audit_summary = json.loads(audit_path.read_text(encoding="utf-8"))
          summary = {
              "status": "CACHE_WARM_INPUTS_VERIFIED",
              "requested_start": "2024-01-01",
              "requested_end": "2024-01-31",
              "market": "both",
              "audit_exit_code": int(os.environ["AUDIT_EXIT_CODE"]),
              "research_gate_complete": bool(audit_summary.get("complete", False)),
              "reconciliation_requested": False,
              "strategy_executed": False,
              "raw_market_data_uploaded": False,
              "cache_file_count": len(cache_files),
              "cache_archive_zip_count": len(archive_files),
              "cache_bytes": cache_bytes,
              "archive_count": len(records),
              "checksum_verified_archive_count": len(records),
              "manifests": records,
          }
          diagnostics = report_dir / "cache_warm_diagnostics.json"
          diagnostics.write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(summary, indent=2))
          PY

      - name: Save verified Binance archive cache
        if: ${{ steps.validate.outcome == 'success' && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: data/cache/
          key: binance-archives-warm-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload manifests and diagnostics only
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: binance-archive-cache-warm-${{ github.run_id }}
          path: |
            reports/generated/cache-warm-${{ github.run_id }}/data_audit_summary.json
            reports/generated/cache-warm-${{ github.run_id }}/cache_warm_diagnostics.json
            data/raw/spot_ETHUSDT_archive_manifest.json
            data/raw/spot_BTCUSDT_archive_manifest.json
            data/raw/um_ETHUSDT_archive_manifest.json
            data/raw/um_BTCUSDT_archive_manifest.json
            data/raw/um_ETHUSDT_funding_manifest.json
            data/raw/um_BTCUSDT_funding_manifest.json
          if-no-files-found: warn
          retention-days: 30
